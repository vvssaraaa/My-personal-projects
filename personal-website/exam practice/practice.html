<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Books & Authors</title>
    <link rel="stylesheet" href="practice.css">
</head>
<body>
    <h1>Book collection Form</h1>
    <h2>Submit ur favorite book to our collection</h2>

    <form id="bookForm">
        <label for="name">Name:</label>
        <input type="text" id="name" required><br>

        <label for="author">Author:</label>
        <input type="text" id="author" required><br>

        <label for="description">Description:</label>
        <input type="text" id="description" required><br>

        <label for="year">Year of appearance:</label>
        <input type="text" id="year" required><br>
        
        <label for="skills">Skill:</label>
        <select id="skills" required>
            <option value="">Select</option>
            <option value="creative">Creative</option>
            <option value="leadership">Leadership</option>
            <option value="problem-solving">Problem solving</option>
            <option value="communication">Communication</option>
        </select><br>

        <button type="submit" id="sendbtn">Submit</button>
    </form>
    <p id="error-message" style="color:red;"></p>
    
</body>
<script src="practice.js"></script>
</html>
